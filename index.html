<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Time Clone</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #0f0;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    h1 {
      font-size: 2em;
      margin-bottom: 10px;
    }
    #clock {
      font-size: 4em;
      letter-spacing: 2px;
    }
    #date {
      font-size: 1.5em;
      margin-top: 10px;
    }
    #timezone {
      font-size: 1em;
      margin-top: 20px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <h1>Current Time</h1>
  <div id="clock">--:--:--</div>
  <div id="date">Loading date...</div>
  <div id="timezone">Detecting timezone...</div>

  <script>
    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString('en-US', { hour12: false });
      const date = now.toLocaleDateString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
      const zone = Intl.DateTimeFormat().resolvedOptions().timeZone;

      document.getElementById('clock').textContent = time;
      document.getElementById('date').textContent = date;
      document.getElementById('timezone').textContent = `Time Zone: ${zone}`;
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
