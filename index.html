<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>World Time by Country</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      padding: 20px;
      text-align: center;
    }
    h1 {
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: left;
    }
    th {
      background-color: #333;
      color: white;
    }
    tbody {
      display: block;
      max-height: 500px;
      overflow-y: scroll;
    }
    thead, tbody tr {
      display: table;
      width: 100%;
      table-layout: fixed;
    }
  </style>
</head>
<body>
  <h1>🌐 Current Time by Country</h1>
  <table>
    <thead>
      <tr>
        <th>Country / Region</th>
        <th>Time Zone</th>
        <th>Current Time</th>
      </tr>
    </thead>
    <tbody id="time-table">
      <tr><td colspan="3">Loading time data...</td></tr>
    </tbody>
  </table>

  <script>
    async function fetchTimeZones() {
      const response = await fetch('https://worldtimeapi.org/api/timezone');
      const zones = await response.json();
      const table = document.getElementById('time-table');
      table.innerHTML = '';

      for (const zone of zones) {
        try {
          const res = await fetch(`https://worldtimeapi.org/api/timezone/${zone}`);
          const data = await res.json();
          const time = new Date(data.datetime).toLocaleTimeString();
          const country = zone.split('/')[0].replace('_', ' ');
          const region = zone.split('/')[1] ? zone.split('/')[1].replace('_', ' ') : '';
          const row = document.createElement('tr');
          row.innerHTML = `<td>${country}${region ? ' / ' + region : ''}</td><td>${zone}</td><td>${time}</td>`;
          table.appendChild(row);
        } catch (err) {
          console.error(`Failed to load ${zone}`, err);
        }
      }
    }

    fetchTimeZones();
  </script>
</body>
</html>
