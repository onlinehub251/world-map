<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>World Time by Country</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      padding: 20px;
      text-align: center;
    }
    h1 {
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: left;
    }
    th {
      background-color: #333;
      color: white;
    }
    tbody {
      display: block;
      max-height: 500px;
      overflow-y: scroll;
    }
    thead, tbody tr {
      display: table;
      width: 100%;
      table-layout: fixed;
    }
  </style>
</head>
<body>
  <h1>🌐 Current Time by Country</h1>
  <table>
    <thead>
      <tr>
        <th>Country</th>
        <th>Time Zone</th>
        <th>Current Time</th>
      </tr>
    </thead>
    <tbody id="time-table"></tbody>
  </table>

  <script>
    const countries = [
      { name: "United Arab Emirates", zone: "Asia/Dubai" },
      { name: "United States (New York)", zone: "America/New_York" },
      { name: "United Kingdom", zone: "Europe/London" },
      { name: "India", zone: "Asia/Kolkata" },
      { name: "Japan", zone: "Asia/Tokyo" },
      { name: "Australia (Sydney)", zone: "Australia/Sydney" },
      { name: "Brazil", zone: "America/Sao_Paulo" },
      { name: "South Africa", zone: "Africa/Johannesburg" },
      { name: "Russia (Moscow)", zone: "Europe/Moscow" },
      { name: "Canada (Toronto)", zone: "America/Toronto" },
      { name: "Germany", zone: "Europe/Berlin" },
      { name: "China", zone: "Asia/Shanghai" },
      { name: "Singapore", zone: "Asia/Singapore" },
      { name: "Argentina", zone: "America/Argentina/Buenos_Aires" },
      { name: "Egypt", zone: "Africa/Cairo" }
    ];

    function updateTimes() {
      const table = document.getElementById("time-table");
      table.innerHTML = "";
      countries.forEach(({ name, zone }) => {
        const time = new Intl.DateTimeFormat('en-US', {
          timeZone: zone,
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        }).format(new Date());
        const row = document.createElement("tr");
        row.innerHTML = `<td>${name}</td><td>${zone}</td><td>${time}</td>`;
        table.appendChild(row);
      });
    }

    setInterval(updateTimes, 1000);
    updateTimes();
  </script>
</body>
</html>
